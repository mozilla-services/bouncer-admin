version: 2.1
jobs:
  style:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install black
          command: python -m pip install black==26.10.1
      - run:
          name: Black Python
          command: python -m black --diff --check .
  security:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install bandit
          command: python -m pip install bandit==1.9.4
      - run:
          name: Bandit Security Check
          command: python -m bandit -r -ll nazgul/
  build:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Create a version.json
          command: |
            # create a version.json per https://github.com/mozilla-services/Dockerflow/blob/master/docs/version_object.md
            printf '{"commit":"%s","version":"%s","source":"https://github.com/%s/%s","build":"%s"}\n' \
            "$CIRCLE_SHA1" \
            "$CIRCLE_TAG" \
            "$CIRCLE_PROJECT_USERNAME" \
            "$CIRCLE_PROJECT_REPONAME" \
            "$CIRCLE_BUILD_URL" > version.json

      - run:
          name: Build Docker image
          command: docker build -t app:build .

  test:
    docker:
      - image: cimg/python:3.14
      - image: cimg/mysql:8.4
        environment:
          MYSQL_DATABASE: bouncer
    steps:
      - checkout
      - run:
          # Our primary container isn't MYSQL so run a sleep command until it's
          # ready.
          name: Waiting for MySQL to be ready
          command: |
            for i in `seq 1 60`;
            do
              nc -z 127.0.0.1 3306 && echo Success && exit 0
              echo -n .
              sleep 1
            done
            echo Failed waiting for MySQL && exit 1
      - run:
          name: Test API and Bouncerscript
          command: |
            test_dir=$(mktemp -d)
            python -m venv "$test_dir/app"
            source "$test_dir/app/bin/activate"
            python -m pip install --require-hashes -r requirements.txt
            python -m pip install --no-deps .

            ADDR=127.0.0.1 AUTH_USERS='{"admin": "admin"}' nazgul &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
              http://127.0.0.1:8000/__heartbeat__
            python -m pytest -vv

            python -m venv "$test_dir/bouncerscript"
            bouncerscript_bin="$test_dir/bouncerscript/bin"
            "$bouncerscript_bin/python" -m pip install "bouncerscript @ git+https://github.com/mozilla-releng/scriptworker-scripts#subdirectory=bouncerscript"
            mkdir -p "$test_dir/fixtures" "$test_dir/work_dir" "$test_dir/artifact_dir"
            cp bouncerscript_task.json "$test_dir/fixtures/task.json"
            cp bouncerscript_prod_task.json "$test_dir/work_dir/task.json"
            cp bouncerscript_config.json bouncerscript_prod_config.json "$test_dir/"
            cd "$test_dir"
            "$bouncerscript_bin/bouncerscript" bouncerscript_config.json
            "$bouncerscript_bin/bouncerscript" bouncerscript_prod_config.json

workflows:
  version: 2

  lint:
    jobs:
      - style

  security:
    jobs:
      - security

  build-test:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/

      - test:
          filters:
            tags:
              only: /.*/
